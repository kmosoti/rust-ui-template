[package]
name = "rust-ui-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false
authors = ["Kennedy Mosoti"]
description = "Shared Leptos CSR UI native host"

[lib]
name = "rust_ui_native_lib"
crate-type = ["lib", "cdylib", "staticlib"]

# Isolate OS dependencies and packaging from browser-only workspace checks.
[workspace]
default-members = ["."]
members = ["html-tests", "../../vendor/tauri-utils-2.10.2", "../../vendor/tauri-codegen-2.7.4", "../../vendor/dirs-sys-0.5.0"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
app-contract = { path = "../../crates/app-contract" }
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "compression"] }

[target.'cfg(target_os = "linux")'.dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["x11", "dbus"] }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[patch.crates-io]
tauri-utils = { path = "../../vendor/tauri-utils-2.10.2" }
tauri-codegen = { path = "../../vendor/tauri-codegen-2.7.4" }
dirs-sys = { path = "../../vendor/dirs-sys-0.5.0" }
wry = { path = "../../vendor/wry-0.57.2" }
markup5ever_rcdom = { path = "../../vendor/markup5ever_rcdom-0.40.1+unofficial" }
