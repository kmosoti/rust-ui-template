[workspace]
members = ["crates/app-core", "crates/app-ui", "crates/client", "tools/browser-tests"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/kmosoti/rust-ui-template"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
