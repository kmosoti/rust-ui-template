name: CSR browser
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    env:
      CARGO_BUILD_JOBS: 2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - run: cargo install trunk --version 0.21.14 --locked
      - run: python3 scripts/setup_frontend.py
      - run: /usr/bin/google-chrome --version
      - run: cargo fetch --locked
      - run: .tools/tailwindcss -i styles/input.css -o styles/generated.css --minify
      - run: python3 scripts/check_css.py
      - run: trunk build --release --locked
      - run: trunk build --release --locked --public-url /sub/ --dist dist/sub
      - run: cargo run -p browser-tests --locked --offline
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
