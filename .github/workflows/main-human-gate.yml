name: Main Branch Human Gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  main-human-approval:
    name: main-human-approval
    runs-on: ubuntu-latest
    environment: main-release
    steps:
      - name: Verify human release approval for main
        env:
          RELEASE_HEAD_REF: ${{ github.head_ref }}
          RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Human reviewer approved promotion of $RELEASE_HEAD_REF ($RELEASE_HEAD_SHA) into main."
