name: Linux native host
on:
  pull_request:
    paths-ignore: ["README.md", "docs/**", "knowledge/**"]
  push:
    branches: [develop]
    paths-ignore: ["README.md", "docs/**", "knowledge/**"]
permissions:
  contents: read
concurrency:
  group: native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      NO_COLOR: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build and launch dependencies
        id: sdk
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb desktop-file-utils
          pkg-config --modversion gtk+-3.0 webkit2gtk-4.1
          echo "version=$(pkg-config --modversion gtk+-3.0 webkit2gtk-4.1 | tr '\n' '-')" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/restore-build-cache
        id: build-cache
        with:
          profile: native
          sdk: ${{ steps.sdk.outputs.version }}
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - run: python3 scripts/setup_ci_tools.py
      - run: echo "$GITHUB_WORKSPACE/.tools" >> "$GITHUB_PATH"
      - run: cargo install tauri-driver --version 2.1.0 --locked --root .tools/driver
      - run: echo "$GITHUB_WORKSPACE/.tools/driver/bin" >> "$GITHUB_PATH"
      - run: python3 scripts/setup_frontend.py && python3 scripts/setup_native_cli.py
      - run: cargo fetch --locked && cargo fetch --manifest-path apps/native/Cargo.toml --locked
      - run: .tools/tailwindcss -i styles/input.css -o styles/generated.css --minify
      - run: trunk build --release --locked
      - run: cargo fmt --manifest-path apps/native/Cargo.toml -- --check
      - name: Rebuild package-owned assets against cached dependencies
        run: cargo clean --manifest-path apps/native/Cargo.toml -p rust-ui-native --release
      - name: Build production DEB and RPM
        working-directory: apps/native
        run: ../../.tools/cargo-tauri tauri build --bundles deb,rpm -- --locked
      - run: cargo clippy --manifest-path apps/native/Cargo.toml --all-targets --locked --offline -- -D warnings
      - name: Install, reinstall and launch production DEB
        run: |
          mkdir -p artifacts
          cp apps/native/target/release/bundle/deb/*.deb artifacts/rust-ui-native-linux.deb
          cp apps/native/target/release/bundle/rpm/*.rpm artifacts/rust-ui-native-linux.rpm
          sha256sum artifacts/rust-ui-native-linux.deb artifacts/rust-ui-native-linux.rpm > artifacts/linux-packages.sha256
          sudo dpkg -i artifacts/rust-ui-native-linux.deb
          sudo dpkg -i artifacts/rust-ui-native-linux.deb
          python3 scripts/check_linux_package.py --format deb
          dbus-run-session -- xvfb-run -a python3 scripts/native_smoke.py --artifact-prefix ubuntu-production
          sudo dpkg --remove rust-ui-template
          test ! -e /usr/bin/rust-ui-native
      - name: Build Fedora 44 runtime test environment
        run: docker build --build-arg APP_UID="$(id -u)" -f .github/containers/fedora44.Dockerfile -t rust-ui-fedora44 .
      - name: Install, reinstall and launch production RPM
        run: docker run --rm -v "$GITHUB_WORKSPACE:/work" -v "$GITHUB_WORKSPACE/.tools/driver/bin/tauri-driver:/usr/local/bin/tauri-driver:ro" rust-ui-fedora44 bash scripts/fedora_package_smoke.sh artifacts/rust-ui-native-linux.rpm
      - name: Build restricted-window DEB and RPM fixtures
        working-directory: apps/native
        run: ../../.tools/cargo-tauri tauri build --bundles deb,rpm --config tauri.e2e.conf.json -- --locked
      - name: Verify denied command in installed restricted DEB
        run: |
          sudo dpkg -i apps/native/target/release/bundle/deb/*.deb
          dbus-run-session -- xvfb-run -a python3 scripts/native_smoke.py --artifact-prefix ubuntu-denied --denial-fixture
          cp apps/native/target/release/bundle/rpm/*.rpm artifacts/restricted-fixture.rpm
      - name: Verify denied command in installed restricted RPM
        run: docker run --rm -v "$GITHUB_WORKSPACE:/work" -v "$GITHUB_WORKSPACE/.tools/driver/bin/tauri-driver:/usr/local/bin/tauri-driver:ro" rust-ui-fedora44 bash scripts/fedora_package_smoke.sh artifacts/restricted-fixture.rpm restricted
      - name: Verify production artifacts remain unchanged
        run: sha256sum --check artifacts/linux-packages.sha256
      - run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: linux-native-evidence
          path: |
            artifacts/*.png
            artifacts/*.json
            artifacts/*.log
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unsigned-linux-packages
          path: |
            artifacts/rust-ui-native-linux.deb
            artifacts/rust-ui-native-linux.rpm
            artifacts/linux-packages.sha256
          retention-days: 7
          if-no-files-found: error
      - uses: ./.github/actions/save-build-cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/develop' && steps.build-cache.outputs.hit != 'true'
        with:
          key: ${{ steps.build-cache.outputs.key }}
